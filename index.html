<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할 일</title>
<style>
:root {
  --bg: #f5f6f8;
  --card: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --line: #e5e7eb;
  --accent: #4f46e5;
  --danger: #dc2626;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  line-height: 1.5;
}
.app {
  max-width: 600px;
  margin: 0 auto;
  padding: 24px 16px 48px;
}
h1 { margin: 0 0 16px; font-size: 1.6rem; }
button, input, select { font: inherit; }
button { cursor: pointer; }

#banner {
  margin-bottom: 16px;
  padding: 10px 12px;
  border-radius: 8px;
  background: #fef2f2;
  color: var(--danger);
  border: 1px solid #fecaca;
}

#progress {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}
.progress-head { display: flex; justify-content: space-between; margin-bottom: 6px; font-weight: 600; }
.bar { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--accent); transition: width .2s; }
.bar.small { height: 6px; margin-top: 2px; }
.hint { margin: 8px 0 0; color: var(--muted); font-size: .9rem; }
.cat-progress { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; font-size: .9rem; }
.cat.empty { opacity: .5; }

#add-form { display: flex; gap: 8px; }
#new-title { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
#new-category { padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
#add-form button { padding: 8px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; }
#add-error { margin: 6px 0 0; color: var(--danger); font-size: .9rem; }

#tabs { display: flex; gap: 6px; margin: 16px 0 8px; }
.tab { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--text); }
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

#list { list-style: none; margin: 0; padding: 0; }
.item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  margin-bottom: 6px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
}
.item .title { flex: 1; }
.item.done .title { text-decoration: line-through; color: var(--muted); }
.item.done { opacity: .7; }
.badge { padding: 1px 8px; border-radius: 999px; color: #fff; font-size: .8rem; white-space: nowrap; }
.icon { border: 0; background: none; padding: 4px; border-radius: 6px; }
.icon:hover { background: var(--bg); }
.empty { padding: 24px; text-align: center; color: var(--muted); }

#clear-done {
  display: block;
  margin: 12px 0 0 auto;
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--card);
  color: var(--muted);
}
#clear-done[hidden] { display: none; }
</style>
</head>
<body>
<main class="app">
  <h1>할 일</h1>
  <div id="banner" hidden></div>

  <section id="progress"></section>

  <form id="add-form" autocomplete="off">
    <input id="new-title" type="text" maxlength="100" placeholder="할 일을 입력하세요" aria-label="새 할 일">
    <select id="new-category" aria-label="카테고리">
      <option value="work">업무</option>
      <option value="personal">개인</option>
      <option value="study">공부</option>
    </select>
    <button type="submit">추가</button>
  </form>
  <p id="add-error" hidden>할 일을 입력하세요</p>

  <nav id="tabs" aria-label="카테고리 필터"></nav>

  <ul id="list"></ul>

  <button id="clear-done" type="button" hidden></button>
</main>

<script>
"use strict";

// ===== 상수 =====
const STORAGE_KEY = "todo-app.v1";
const MAX_TITLE = 100;
const CATEGORIES = {
  work:     { label: "업무", color: "#3b82f6" },
  personal: { label: "개인", color: "#10b981" },
  study:    { label: "공부", color: "#f59e0b" }
};
const FILTERS = ["all", "work", "personal", "study"];

// ===== 저장소 =====
const WARNINGS = {
  unavailable: "데이터를 저장할 수 없습니다. 새로고침하면 사라집니다.",
  corrupt: "저장된 데이터를 읽지 못해 백업 후 초기화했습니다."
};

function getStorage() {
  try {
    const s = window.localStorage;
    s.getItem(STORAGE_KEY);
    return s;
  } catch {
    return null;
  }
}

function loadTodos(storage, now = Date.now()) {
  if (!storage) return { todos: [], warning: "unavailable" };
  let raw;
  try {
    raw = storage.getItem(STORAGE_KEY);
  } catch {
    return { todos: [], warning: "unavailable" };
  }
  const parsed = parseStored(raw);
  if (parsed.status === "corrupt") {
    try {
      storage.setItem(STORAGE_KEY + ".backup-" + now, raw);
    } catch {
      // 백업 실패는 무시한다
    }
    return { todos: [], warning: "corrupt" };
  }
  if (parsed.skipped > 0) console.warn("[todo] 잘못된 항목 " + parsed.skipped + "개를 건너뛰었습니다.");
  return { todos: parsed.todos, warning: null };
}

function saveTodos(storage, todos) {
  if (!storage) return false;
  try {
    storage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, todos }));
    return true;
  } catch {
    return false;
  }
}

// ===== 순수 로직 =====
function isCategory(value) {
  return typeof value === "string" && Object.prototype.hasOwnProperty.call(CATEGORIES, value);
}

function validateTitle(raw) {
  if (typeof raw !== "string") return { ok: false };
  const title = raw.trim();
  if (title.length === 0 || title.length > MAX_TITLE) return { ok: false };
  return { ok: true, title };
}

function createTodo(title, category, now = Date.now()) {
  const id = now.toString(36) + Math.random().toString(36).slice(2, 8);
  return { id, title, category, done: false, createdAt: now };
}

function sortTodos(todos) {
  return todos.slice().sort((a, b) => (a.done - b.done) || (a.createdAt - b.createdAt));
}

function filterTodos(todos, filter) {
  return filter === "all" ? todos.slice() : todos.filter(t => t.category === filter);
}

function calcProgress(todos) {
  const result = {};
  for (const key of FILTERS) {
    const group = filterTodos(todos, key);
    const done = group.filter(t => t.done).length;
    const total = group.length;
    result[key] = { done, total, percent: total ? Math.round(done / total * 100) : 0 };
  }
  return result;
}

function parseStored(raw) {
  if (raw === null || raw === undefined) return { todos: [], status: "empty", skipped: 0 };
  let data;
  try {
    data = JSON.parse(raw);
  } catch {
    return { todos: [], status: "corrupt", skipped: 0 };
  }
  if (!data || typeof data !== "object" || data.version !== 1 || !Array.isArray(data.todos)) {
    return { todos: [], status: "corrupt", skipped: 0 };
  }
  const todos = [];
  const seen = new Set();
  let skipped = 0;
  for (const item of data.todos) {
    const valid = item && typeof item === "object"
      && typeof item.id === "string" && item.id.length > 0 && !seen.has(item.id)
      && validateTitle(item.title).ok
      && isCategory(item.category)
      && typeof item.done === "boolean"
      && Number.isFinite(item.createdAt);
    if (!valid) {
      skipped++;
      continue;
    }
    seen.add(item.id);
    todos.push({
      id: item.id,
      title: validateTitle(item.title).title,
      category: item.category,
      done: item.done,
      createdAt: item.createdAt
    });
  }
  return { todos, status: "ok", skipped };
}

// ===== 상태 =====
const storage = getStorage();

const state = {
  todos: [],
  filter: "all",
  editingId: null,
  editDraft: null,
  editError: false,
  lastCategory: "work",
  warning: null
};

// ===== 상태 변경 =====
function commit(todos) {
  state.todos = todos;
  if (!saveTodos(storage, todos)) state.warning = "unavailable";
  render();
}

function addTodo(rawTitle, category) {
  const v = validateTitle(rawTitle);
  if (!v.ok || !isCategory(category)) return false;
  commit(state.todos.concat(createTodo(v.title, category)));
  return true;
}

function toggleTodo(id) {
  commit(state.todos.map(t => (t.id === id ? { ...t, done: !t.done } : t)));
}

function deleteTodo(id) {
  commit(state.todos.filter(t => t.id !== id));
}

function clearDone() {
  const n = state.todos.filter(t => t.done).length;
  if (n === 0) return;
  if (!confirm("완료한 할 일 " + n + "개를 삭제할까요?")) return;
  commit(state.todos.filter(t => !t.done));
}

function setFilter(filter) {
  if (!FILTERS.includes(filter)) return;
  state.filter = filter;
  $("new-category").value = filter === "all" ? state.lastCategory : filter;
  render();
}

// ===== 렌더링 =====
const $ = id => document.getElementById(id);

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "text") node.textContent = value;
    else if (key === "class") node.className = value;
    else if (key === "style") Object.assign(node.style, value);
    else if (key === "dataset") Object.assign(node.dataset, value);
    else if (key in node && typeof value !== "string") node[key] = value;
    else node.setAttribute(key, value);
  }
  for (const child of children) node.append(child);
  return node;
}

function bar(percent, color, extraClass = "") {
  return el("div", { class: ("bar " + extraClass).trim() }, [
    el("div", { class: "fill", style: { width: percent + "%", background: color || "" } })
  ]);
}

function render() {
  renderBanner();
  renderProgress();
  renderTabs();
  renderList();
  renderClearDone();
}

function renderBanner() {
  const banner = $("banner");
  if (state.warning) {
    banner.textContent = WARNINGS[state.warning];
    banner.hidden = false;
  } else {
    banner.textContent = "";
    banner.hidden = true;
  }
}

function renderProgress() {
  const p = calcProgress(state.todos);
  const children = [
    el("div", { class: "progress-head" }, [
      el("span", { class: "progress-label", text: "전체 진행률" }),
      el("span", { class: "progress-count", text: p.all.done + " / " + p.all.total + " (" + p.all.percent + "%)" })
    ]),
    bar(p.all.percent)
  ];
  if (p.all.total === 0) children.push(el("p", { class: "hint", text: "할 일을 추가해 보세요" }));
  children.push(el("div", { class: "cat-progress" }, Object.entries(CATEGORIES).map(([key, cat]) =>
    el("div", { class: "cat" + (p[key].total === 0 ? " empty" : "") }, [
      el("span", { text: cat.label + " " + p[key].done + "/" + p[key].total }),
      bar(p[key].percent, cat.color, "small")
    ])
  )));
  $("progress").replaceChildren(...children);
}

function renderTabs() {
  $("tabs").replaceChildren(...FILTERS.map(key => {
    const label = key === "all" ? "전체" : CATEGORIES[key].label;
    const count = filterTodos(state.todos, key).length;
    return el("button", {
      type: "button",
      class: "tab",
      dataset: { filter: key },
      "aria-pressed": String(state.filter === key),
      text: label + " " + count
    });
  }));
}

function renderItem(todo) {
  const cat = CATEGORIES[todo.category];
  return el("li", { class: todo.done ? "item done" : "item", dataset: { id: todo.id } }, [
    el("input", { type: "checkbox", checked: todo.done, dataset: { action: "toggle" }, "aria-label": todo.title + " 완료" }),
    el("span", { class: "title", text: todo.title }),
    el("span", { class: "badge", style: { background: cat.color }, text: cat.label }),
    el("button", { type: "button", class: "icon", dataset: { action: "edit" }, "aria-label": todo.title + " 수정", text: "✎" }),
    el("button", { type: "button", class: "icon", dataset: { action: "delete" }, "aria-label": todo.title + " 삭제", text: "🗑" })
  ]);
}

function renderList() {
  const visible = filterTodos(sortTodos(state.todos), state.filter);
  if (visible.length === 0) {
    const message = state.todos.length === 0 ? "할 일이 없습니다" : "이 카테고리에 할 일이 없습니다";
    $("list").replaceChildren(el("li", { class: "empty", text: message }));
    return;
  }
  $("list").replaceChildren(...visible.map(renderItem));
}

function renderClearDone() {
  const n = state.todos.filter(t => t.done).length;
  const button = $("clear-done");
  button.hidden = n === 0;
  button.textContent = "완료 항목 정리 (" + n + ")";
}

// ===== 이벤트 =====
$("add-form").addEventListener("submit", e => {
  e.preventDefault();
  const input = $("new-title");
  if (addTodo(input.value, $("new-category").value)) {
    input.value = "";
    $("add-error").hidden = true;
    input.focus();
  } else {
    $("add-error").hidden = false;
  }
});

$("new-title").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.isComposing) e.preventDefault();
});

$("new-title").addEventListener("input", () => {
  $("add-error").hidden = true;
});

$("new-category").addEventListener("change", e => {
  state.lastCategory = e.target.value;
});

$("tabs").addEventListener("click", e => {
  const button = e.target.closest("button[data-filter]");
  if (button) setFilter(button.dataset.filter);
});

$("list").addEventListener("change", e => {
  if (e.target.dataset.action !== "toggle") return;
  toggleTodo(e.target.closest("li[data-id]").dataset.id);
});

$("list").addEventListener("click", e => {
  const button = e.target.closest("button[data-action]");
  if (!button) return;
  const id = button.closest("li[data-id]").dataset.id;
  if (button.dataset.action === "delete") deleteTodo(id);
});

$("clear-done").addEventListener("click", clearDone);

window.addEventListener("storage", e => {
  if (e.key !== STORAGE_KEY) return;
  state.todos = parseStored(e.newValue).todos;
  if (state.editingId && !state.todos.some(t => t.id === state.editingId)) {
    state.editingId = null;
    state.editDraft = null;
    state.editError = false;
  }
  render();
});

// ===== 자체 테스트 =====
const selfTests = [];

function test(name, fn) {
  selfTests.push({ name, fn });
}

function assertEqual(actual, expected) {
  const a = JSON.stringify(actual);
  const e = JSON.stringify(expected);
  if (a !== e) throw new Error("expected " + e + ", got " + a);
}

function assert(condition, message) {
  if (!condition) throw new Error(message || "assertion failed");
}

function runSelfTests() {
  let passed = 0;
  let failed = 0;
  for (const { name, fn } of selfTests) {
    try {
      fn();
      passed++;
    } catch (err) {
      failed++;
      console.error("[self-test] FAIL " + name + ": " + err.message);
    }
  }
  console.log("[self-test] " + passed + " passed, " + failed + " failed");
}

function makeTodo(overrides) {
  return Object.assign({ id: "a", title: "할 일", category: "work", done: false, createdAt: 1 }, overrides);
}

test("validateTitle trims", () => {
  assertEqual(validateTitle("  보고서  "), { ok: true, title: "보고서" });
});

test("validateTitle rejects blank", () => {
  assertEqual(validateTitle(""), { ok: false });
  assertEqual(validateTitle("   "), { ok: false });
  assertEqual(validateTitle(null), { ok: false });
  assertEqual(validateTitle(123), { ok: false });
});

test("validateTitle length bounds", () => {
  assertEqual(validateTitle("a").ok, true);
  assertEqual(validateTitle("가".repeat(100)).ok, true);
  assertEqual(validateTitle("가".repeat(101)), { ok: false });
});

test("createTodo shape", () => {
  const t = createTodo("보고서", "work", 1000);
  assert(typeof t.id === "string" && t.id.length > 0, "id must be a non-empty string");
  const { id, ...rest } = t;
  assertEqual(rest, { title: "보고서", category: "work", done: false, createdAt: 1000 });
  assert(createTodo("보고서", "work", 1000).id !== t.id, "ids must differ");
});

test("sortTodos order", () => {
  const input = [
    makeTodo({ id: "a", done: true, createdAt: 1 }),
    makeTodo({ id: "b", done: false, createdAt: 3 }),
    makeTodo({ id: "c", done: false, createdAt: 2 })
  ];
  assertEqual(sortTodos(input).map(t => t.id), ["c", "b", "a"]);
  assertEqual(input.map(t => t.id), ["a", "b", "c"]);
});

test("filterTodos", () => {
  const list = [
    makeTodo({ id: "a", category: "work" }),
    makeTodo({ id: "b", category: "work" }),
    makeTodo({ id: "c", category: "study" })
  ];
  assertEqual(filterTodos(list, "all").length, 3);
  assertEqual(filterTodos(list, "work").length, 2);
  assertEqual(filterTodos(list, "personal").length, 0);
});

test("calcProgress empty", () => {
  const zero = { done: 0, total: 0, percent: 0 };
  assertEqual(calcProgress([]), { all: zero, work: zero, personal: zero, study: zero });
});

test("calcProgress mixed", () => {
  const list = [
    makeTodo({ id: "a", category: "work", done: true }),
    makeTodo({ id: "b", category: "work", done: true }),
    makeTodo({ id: "c", category: "work", done: false }),
    makeTodo({ id: "d", category: "study", done: false })
  ];
  assertEqual(calcProgress(list), {
    all:      { done: 2, total: 4, percent: 50 },
    work:     { done: 2, total: 3, percent: 67 },
    personal: { done: 0, total: 0, percent: 0 },
    study:    { done: 0, total: 1, percent: 0 }
  });
});

test("parseStored empty", () => {
  assertEqual(parseStored(null), { todos: [], status: "empty", skipped: 0 });
});

test("parseStored corrupt", () => {
  for (const raw of ["not json{", '{"version":2,"todos":[]}', '{"version":1,"todos":"x"}', "[]"]) {
    const r = parseStored(raw);
    assertEqual([r.status, r.todos], ["corrupt", []]);
  }
});

test("parseStored skips invalid", () => {
  const raw = JSON.stringify({
    version: 1,
    todos: [
      makeTodo({ id: "a" }),
      makeTodo({ id: "b" }),
      makeTodo({ id: "c", category: "etc" }),
      makeTodo({ id: "d", title: "   " }),
      makeTodo({ id: "a", title: "중복" }),
      makeTodo({ id: "e", done: "yes" })
    ]
  });
  const r = parseStored(raw);
  assertEqual(r.status, "ok");
  assertEqual(r.todos.map(t => t.id), ["a", "b"]);
  assertEqual(r.skipped, 4);
});

test("parseStored normalizes title", () => {
  const raw = JSON.stringify({ version: 1, todos: [makeTodo({ title: "  운동  " })] });
  assertEqual(parseStored(raw).todos[0].title, "운동");
});

function makeFakeStorage(initial = {}) {
  const data = Object.assign({}, initial);
  return {
    data,
    getItem: key => (Object.prototype.hasOwnProperty.call(data, key) ? data[key] : null),
    setItem: (key, value) => { data[key] = String(value); }
  };
}

const throwingStorage = {
  getItem() { throw new Error("storage unavailable"); },
  setItem() { throw new Error("storage unavailable"); }
};

test("loadTodos unavailable", () => {
  assertEqual(loadTodos(null), { todos: [], warning: "unavailable" });
});

test("loadTodos empty", () => {
  assertEqual(loadTodos(makeFakeStorage()), { todos: [], warning: null });
});

test("loadTodos corrupt backs up", () => {
  const fake = makeFakeStorage({ "todo-app.v1": "x" });
  assertEqual(loadTodos(fake, 5).warning, "corrupt");
  assertEqual(fake.data["todo-app.v1.backup-5"], "x");
});

test("loadTodos ok", () => {
  const fake = makeFakeStorage({ "todo-app.v1": JSON.stringify({ version: 1, todos: [makeTodo()] }) });
  const r = loadTodos(fake);
  assertEqual([r.todos.length, r.warning], [1, null]);
});

test("saveTodos writes", () => {
  const fake = makeFakeStorage();
  const todo = makeTodo();
  assertEqual(saveTodos(fake, [todo]), true);
  assertEqual(JSON.parse(fake.data["todo-app.v1"]), { version: 1, todos: [todo] });
});

test("saveTodos failures", () => {
  assertEqual(saveTodos(throwingStorage, []), false);
  assertEqual(saveTodos(null, []), false);
});

// ===== 초기화 =====
const loaded = loadTodos(storage);
state.todos = loaded.todos;
state.warning = loaded.warning;
render();

if (location.hash === "#test") runSelfTests();
</script>
</body>
</html>
